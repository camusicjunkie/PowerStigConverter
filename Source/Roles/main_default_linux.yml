# Defaults for the generated role.
#
# The severity toggles (<%= $PLASTER_PARAM_VariablePrefix %>_cat1 through cat3), every rule toggle
# and every organisation value are generated by New-AnsiblePlaybook into the
# main_default_severity.yml, main_default_cat*.yml and main_default_org.yml files that sit beside
# this one in defaults/main/.
# Only values that cannot be derived from the STIG data belong here.
#
# Linux has no Server Core concept, so unlike the Windows template this declares nothing else.
