---
# Defaults for the generated role.
#
# The severity toggles (stig_server_2022_cat1 through cat3) and every organisation
# value are generated by New-AnsiblePlaybook into the main_default_org.yml and
# main_default_cat*.yml files that sit beside this one in defaults/main/.
# Only values that cannot be derived from the STIG data belong here.

# Set to true by tasks/main.yml when the target is a Server Core installation.
# Declared here so tasks guarded on it also evaluate on Desktop Experience installs,
# where the set_fact never runs and the variable would otherwise be undefined.
stig_server_2022_server_core: false
