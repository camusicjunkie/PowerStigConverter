---
# Generated once by the scaffold and never overwritten - New-AnsibleRoleScaffold only runs
# the template when the role does not already exist. Edit galaxy_info here if the role's
# needs change.
galaxy_info:
  role_name: <%= $PLASTER_PARAM_RoleName %>
  description: STIG hardening role for <%= $PLASTER_PARAM_OsDescription %>
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions:
        - "<%= $PLASTER_PARAM_OsMajorVersion %>"

# Every Linux task generator targets ansible.builtin only, which ships with ansible-core,
# so no collections entry is needed here.
