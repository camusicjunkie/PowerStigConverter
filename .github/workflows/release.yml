name: Release

# A tag push is the trigger: tagging main as vX.Y.Z builds, tests and publishes that
# version. The tag has to agree with the version GitVersion derives, which a step checks.
on:
  push:
    tags: ['v*']

permissions:
  # To create the GitHub release the manifest's ReleaseNotes link points at
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v5
        with:
          # GitVersion needs the full history to determine the version
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Put GitVersion on PATH
        # See ci.yml: the setup action installs dotnet-gitversion.exe without
        # putting it on PATH, and the build shells out to bare 'gitversion'.
        run: |
          $exe = Get-ChildItem -Path $env:GITVERSION_PATH -Filter '*gitversion*.exe' -Recurse |
              Select-Object -First 1
          if (-not $exe) { throw "No gitversion executable found under $env:GITVERSION_PATH" }

          $shim = Join-Path $env:RUNNER_TEMP 'gitversion-shim'
          New-Item -ItemType Directory -Path $shim -Force | Out-Null
          if ($exe.Name -eq 'gitversion.exe') {
              $dir = $exe.Directory.FullName
          }
          else {
              Set-Content -Path (Join-Path $shim 'gitversion.cmd') `
                  -Value "@echo off`r`n`"$($exe.FullName)`" %*" -Encoding ascii
              $dir = $shim
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve dependencies
        run: |
          Install-Module PSDepend -Force -Scope CurrentUser
          Invoke-PSDepend -Path .\PowerStigConverter.depend.psd1 -Force
          # Each step is a fresh shell; persist PSModulePath for later steps
          "PSModulePath=$env:GITHUB_WORKSPACE\build\modules;$env:PSModulePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Analyze
        run: .\build.ps1 -Task Analyze

      - name: Build
        run: .\build.ps1 -Task Build

      - name: Test
        run: .\build.ps1 -Task Test

      - name: Verify the tag matches the built version
        id: version
        run: |
          $tagVersion = '${{ github.ref_name }}' -replace '^v' -as [Version]
          if (-not $tagVersion) { throw "Tag '${{ github.ref_name }}' is not a version" }

          $manifest = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\build\PowerStigConverter" -Filter PowerStigConverter.psd1 -Recurse
          $buildVersion = (Import-PowerShellDataFile -Path $manifest.FullName)['ModuleVersion'] -as [Version]

          if ($tagVersion -ne $buildVersion) {
              throw "Tag $tagVersion does not match build version $buildVersion"
          }
          "version=$buildVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check the version is not already on the Gallery
        # Publishing an existing version fails anyway, but only after the upload; this
        # says why up front. A name owned by someone else fails at the publish step.
        run: |
          $existing = Find-Module -Name PowerStigConverter -Repository PSGallery -AllVersions -ErrorAction SilentlyContinue
          if ($existing.Version -contains '${{ steps.version.outputs.version }}') {
              throw "PowerStigConverter ${{ steps.version.outputs.version }} is already on the PowerShell Gallery"
          }

      - name: Publish to the PowerShell Gallery
        env:
          NuGetApiKey: ${{ secrets.NUGET_API_KEY }}
        # The PublishToPSGallery task reads $env:NuGetApiKey when the parameter
        # is not passed, so the key never lands in the command line or logs.
        run: .\build.ps1 -Task Publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' --title 'PowerStigConverter ${{ steps.version.outputs.version }}' --generate-notes --verify-tag
