name: CI

# The module is Windows-only - it generates roles from Windows STIG data and its tests load
# System.Security.AccessControl enum values - so there is nothing to gain from a linux runner.
on:
  push:
    branches:
      - main
      - 'tests/**'
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The manifest declares PowerShellVersion 5.1, so both engines are tested rather than one
    # being assumed to follow from the other. They do not always agree: Set-Content -Encoding
    # utf8 writes a BOM on 5.1 and not on 7, which is how that divergence was found.
    #
    # The engine is invoked as a child process rather than selected with `shell`, because `shell`
    # is validated against a fixed list of values before expressions are evaluated - a
    # `shell: ${{ matrix.shell }}` fails the whole workflow at compile time, with no jobs started.
    name: Test (${{ matrix.engine }})
    runs-on: windows-latest

    # The host shell that launches the child engine. A literal, for the reason in the comment
    # above. The child is invoked bare rather than through the call operator, because a run
    # scalar opening with & is a YAML anchor and fails the workflow the same way.
    defaults:
      run:
        shell: pwsh

    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: PowerShell 7
            exe: pwsh
            id: pwsh
            coverage: true
          - engine: Windows PowerShell 5.1
            exe: powershell
            id: windows-powershell
            coverage: false

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Has to run inside the engine under test: the two read different module directories, so
      # installing from one leaves the other with nothing.
      - name: Install dependencies
        run: ${{ matrix.exe }} -NoProfile -File ./ci/Install-Dependencies.ps1

      # Builds the module from Source and runs the suite against the build output. -CI writes
      # NUnit results and exits non-zero on any failure, so the step fails the job by itself.
      # Coverage is measured once, on 7 - it reports which lines ran, which does not differ by
      # engine, and two jobs writing it would race for the same artifact.
      - name: Run tests with coverage
        if: matrix.coverage
        run: ${{ matrix.exe }} -NoProfile -File ./Invoke-Tests.ps1 -CI -CodeCoverage

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: ${{ matrix.exe }} -NoProfile -File ./Invoke-Tests.ps1 -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.id }}
          path: build/testResults.xml
          if-no-files-found: error

      - name: Upload coverage
        if: always() && matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage.xml
          if-no-files-found: error
